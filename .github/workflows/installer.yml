# Builds OpenDialerSetup.exe (installer/OpenDialer.iss) and attaches it to the GitHub release.
# Release: push a tag like v0.2.0. Or run it by hand from the Actions tab to get the .exe as a download.
name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME.TrimStart("v") }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\OpenDialer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDialerSetup
          path: installer/Output/OpenDialerSetup.exe
      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/OpenDialerSetup.exe
