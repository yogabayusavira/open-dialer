<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111110" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Open Dialer v2</title>
    <!-- set the saved theme before first paint so the loading screen doesn't flash dark in light mode -->
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("open-dialer-theme") === "light" ? "light" : "dark"; } catch {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
